<script>
const EDGE_STRINGS=[
'GGRRYY','GGYYRR','GGYRRY','RRGYYG','GGRYYR','YGRYRG','GRYGYR','RGYRYG',
'YYRGRG','YYGRGR','GGRYRY','GGYRYR','RRGYGY','RRYGYG','BBYYGG','BBGGYY',
'BBYGGY','BBGYYG','GGBYYB','YBGYGB','GBYGYB','BGYBYG','YYBGBG','YYGBGB',
'GGBYBY','GGYBYB','BBGYGY','BBYGYG','BBYYRR','BBRRYY','BBYRRY','BBRYYR',
'RRBYYB','YBRYRB','RBYRYB','BRYBYR','YYBRBR','YYRBRB','RRBYBY','RRYBYB',
'BBRYRY','BBYRYR','BBGGRR','BBRRGG','BBGRRG','BBRGGR','GGBRRB','GBRGRB',
'RBGRGB','BGRBRG','GGBRBR','GGRBRB','RRBGBG','RRGBGB','BBRGRG','BBGRGR',
];
const CLR={R:'#d42020',Y:'#e8b800',G:'#1a8a1a',B:'#1a50cc'};
const CN={R:'Red',Y:'Yellow',G:'Green',B:'Blue'};
const ALL_COLS=['R','Y','B','G'];

function edgesToCurves(es){
  const used=Array(6).fill(false),c=[];
  for(let i=0;i<6;i++){if(used[i])continue;for(let j=i+1;j<6;j++){if(!used[j]&&es[j]===es[i]){c.push({c:es[i],e1:i,e2:j});used[i]=used[j]=true;break;}}}return c;
}
function rotateEdges(es,n){n=((n%6)+6)%6;return n?es.slice(6-n)+es.slice(0,6-n):es;}
const TILES=EDGE_STRINGS.map((es,i)=>({n:i+1,edges:es,curves:edgesToCurves(es)}));
const DIRS=[[0,-1],[1,-1],[1,0],[0,1],[-1,1],[-1,0]];
const hk=(q,r)=>`${q},${r}`;
const fk=k=>{const[q,r]=k.split(',').map(Number);return{q,r};};
const nbrs=(q,r)=>DIRS.map(([a,b])=>({q:q+a,r:r+b}));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}}

// ── Geometry helpers ──────────────────────────────────────────────────────────
function hCorner(cx,cy,i,sz){const a=Math.PI/180*(60*i+30);return{x:cx+sz*Math.cos(a),y:cy+sz*Math.sin(a)};}
function eMid(cx,cy,e,sz){
  const c1=hCorner(cx,cy,e,sz),c2=hCorner(cx,cy,(e+1)%6,sz);
  return{x:(c1.x+c2.x)/2,y:(c1.y+c2.y)/2};
}
function hexPath(ct,cx,cy,sz){
  ct.beginPath();
  for(let i=0;i<6;i++){const c=hCorner(cx,cy,i,sz);i?ct.lineTo(c.x,c.y):ct.moveTo(c.x,c.y);}
  ct.closePath();
}

// Control point always pulled toward centre (concave inward)
function ctrlPt(cx,cy,e1,e2,sz){
  const p1=eMid(cx,cy,e1,sz),p2=eMid(cx,cy,e2,sz);
  const diff=Math.abs(e1-e2),span=Math.min(diff,6-diff);
  if(span===3) return{x:cx,y:cy,straight:true};
  const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
  const pull=span===1?0.5:0.38;
  return{x:mx+pull*(cx-mx),y:my+pull*(cy-my),straight:false};
}

// Evaluate quadratic bezier at t
function qbez(p0,cp,p1,t){
  const s=1-t;
  return{x:s*s*p0.x+2*s*t*cp.x+t*t*p1.x, y:s*s*p0.y+2*s*t*cp.y+t*t*p1.y};
}

// Find intersection parameter t on curve B where it crosses curve A.
// Returns t value on curveB, or null if no intersection found.
// Uses sampling: find t on B where distance to any point on A is minimised,
// and that distance is less than threshold (linewidth).
function findCrossing(p0a,cpa,p1a,straightA, p0b,cpb,p1b,straightB, threshold){
  const N=120;
  // Sample curve A
  const ptsA=[];
  for(let i=0;i<=N;i++){
    const t=i/N;
    if(straightA){ptsA.push({x:p0a.x+(p1a.x-p0a.x)*t,y:p0a.y+(p1a.y-p0a.y)*t});}
    else ptsA.push(qbez(p0a,cpa,p1a,t));
  }
  // For each t on B, find min dist to A
  let bestDist=Infinity,bestT=0.5;
  for(let i=0;i<=N;i++){
    const t=i/N;
    let pb;
    if(straightB) pb={x:p0b.x+(p1b.x-p0b.x)*t,y:p0b.y+(p1b.y-p0b.y)*t};
    else pb=qbez(p0b,cpb,p1b,t);
    let minD=Infinity;
    for(const pa of ptsA){
      const d=Math.hypot(pb.x-pa.x,pb.y-pa.y);
      if(d<minD) minD=d;
    }
    if(minD<bestDist){bestDist=minD;bestT=t;}
  }
  // Only return if they actually cross (distance less than threshold)
  return bestDist<threshold ? bestT : null;
}

// Determine curve priority: higher = goes on top
// Span 3 (straight) > span 2 > span 1. Tie-break by lower e1.
function curvePriority(e1,e2){
  const diff=Math.abs(e1-e2),span=Math.min(diff,6-diff);
  return span*10 - e1; // higher span = higher priority
}

// Draw a quadratic bezier curve with a gap around parameter tGap
// Draws two segments: [0..tGap-halfGap] and [tGap+halfGap..1]
function drawBezWithGap(ct,p0,cp,p1,straight,tGap,halfGap){
  const t1=Math.max(0,tGap-halfGap);
  const t2=Math.min(1,tGap+halfGap);
  // Segment 1: t=0 to t=t1
  if(t1>0.01){
    const ep1=straight?{x:p0.x+(p1.x-p0.x)*t1,y:p0.y+(p1.y-p0.y)*t1}:qbez(p0,cp,p1,t1);
    // For quadratic bezier sub-curve from 0 to t1: de Casteljau subdivision
    if(straight){
      ct.beginPath();ct.moveTo(p0.x,p0.y);ct.lineTo(ep1.x,ep1.y);ct.stroke();
    } else {
      const subCp={x:p0.x+(cp.x-p0.x)*t1,y:p0.y+(cp.y-p0.y)*t1};
      ct.beginPath();ct.moveTo(p0.x,p0.y);ct.quadraticCurveTo(subCp.x,subCp.y,ep1.x,ep1.y);ct.stroke();
    }
  }
  // Segment 2: t=t2 to t=1
  if(t2<0.99){
    const sp2=straight?{x:p0.x+(p1.x-p0.x)*t2,y:p0.y+(p1.y-p0.y)*t2}:qbez(p0,cp,p1,t2);
    if(straight){
      ct.beginPath();ct.moveTo(sp2.x,sp2.y);ct.lineTo(p1.x,p1.y);ct.stroke();
    } else {
      // Sub-curve from t2 to 1
      const subCp={x:cp.x+(p1.x-cp.x)*t2,y:cp.y+(p1.y-cp.y)*t2};
      // Actually need proper de Casteljau for sub-curve starting at t2
      // Point at t2: already sp2
      // Control point for [t2..1]: lerp(cp,p1,t2) ... actually:
      // For sub-bezier from t to 1: start=B(t), cp_new = lerp(cp,p1,t), end=p1
      ct.beginPath();ct.moveTo(sp2.x,sp2.y);ct.quadraticCurveTo(subCp.x,subCp.y,p1.x,p1.y);ct.stroke();
    }
  }
}

// ── Main tile drawing function ────────────────────────────────────────────────
function drawHex(ct,cx,cy,tile,sz,alpha=1){
  ct.save();
  ct.globalAlpha=alpha;

  hexPath(ct,cx,cy,sz);
  ct.fillStyle='#0a0a0a';
  ct.fill();

  // Clip to hex
  hexPath(ct,cx,cy,sz*0.995);
  ct.clip();

  const lw=sz*0.36;
  const curves=tile.curves;

  // Build geometry for each curve
  const geom=curves.map(cv=>{
    const p0=eMid(cx,cy,cv.e1,sz),p1=eMid(cx,cy,cv.e2,sz);
    const cp=ctrlPt(cx,cy,cv.e1,cv.e2,sz);
    const diff=Math.abs(cv.e1-cv.e2),span=Math.min(diff,6-diff);
    return{cv,p0,cp,p1,straight:cp.straight,span,pri:curvePriority(cv.e1,cv.e2)};
  });

  // Sort: draw lowest priority (under) first, highest (over) last
  const sorted=[...geom].sort((a,b)=>a.pri-b.pri);

  // Find crossings between all pairs
  // crossings[i] = list of t values where curve i (in sorted order) is crossed by a higher-priority curve
  const crossings=sorted.map(()=>[]);
  const halfGap=0.055; // gap half-width in t-space

  for(let i=0;i<sorted.length;i++){
    for(let j=i+1;j<sorted.length;j++){
      const under=sorted[i],over=sorted[j];
      // Find where the UNDER curve is crossed by the OVER curve
      const tUnder=findCrossing(
        over.p0,over.cp,over.p1,over.straight,
        under.p0,under.cp,under.p1,under.straight,
        lw*0.7
      );
      if(tUnder!==null){
        crossings[i].push(tUnder);
      }
    }
  }

  // Draw curves in order (under to over)
  for(let i=0;i<sorted.length;i++){
    const {cv,p0,cp,p1,straight}=sorted[i];

    // Black outline pass
    ct.strokeStyle='#000';
    ct.lineWidth=lw+sz*0.08;
    ct.lineCap='butt';

    if(crossings[i].length===0){
      ct.beginPath();ct.moveTo(p0.x,p0.y);
      if(straight) ct.lineTo(p1.x,p1.y);
      else ct.quadraticCurveTo(cp.x,cp.y,p1.x,p1.y);
      ct.stroke();
    } else {
      // Draw with gaps at each crossing (black outline also gapped so background shows through)
      for(const tGap of crossings[i]){
        drawBezWithGap(ct,p0,cp,p1,straight,tGap,halfGap);
      }
    }

    // Colour pass
    ct.strokeStyle=CLR[cv.c];
    ct.lineWidth=lw;
    ct.lineCap='butt';

    if(crossings[i].length===0){
      ct.beginPath();ct.moveTo(p0.x,p0.y);
      if(straight) ct.lineTo(p1.x,p1.y);
      else ct.quadraticCurveTo(cp.x,cp.y,p1.x,p1.y);
      ct.stroke();
    } else {
      for(const tGap of crossings[i]){
        drawBezWithGap(ct,p0,cp,p1,straight,tGap,halfGap);
      }
    }
  }

  ct.restore();

  // Hex border
  ct.save();ct.globalAlpha=alpha;
  hexPath(ct,cx,cy,sz);
  ct.strokeStyle='rgba(255,255,255,0.07)';ct.lineWidth=1;ct.stroke();
  ct.restore();
}

// ── Setup ─────────────────────────────────────────────────────────────────────
let setupPlayers=[{col:'R'},{col:'B'}];
let numPlayers=2;
function buildSetup(){
  const conf=document.getElementById('pconf');conf.innerHTML='';
  setupPlayers=setupPlayers.slice(0,numPlayers);
  while(setupPlayers.length<numPlayers)setupPlayers.push({col:null});
  const used=new Set(setupPlayers.filter(p=>p.col).map(p=>p.col));
  for(let i=0;i<setupPlayers.length;i++){
    if(!setupPlayers[i].col){const free=ALL_COLS.find(c=>!used.has(c));setupPlayers[i].col=free||null;if(free)used.add(free);}
  }
  setupPlayers.forEach((pl,i)=>{
    const div=document.createElement('div');div.className='pc';
    const lbl=document.createElement('div');lbl.className='pc-name';lbl.textContent=`Player ${i+1}`;
    const opts=document.createElement('div');opts.className='copts';
    ALL_COLS.forEach(c=>{
      const btn=document.createElement('div');btn.className='co';btn.style.background=CLR[c];
      const usedByOther=setupPlayers.some((p,j)=>j!==i&&p.col===c);
      if(usedByOther)btn.classList.add('used');
      if(pl.col===c)btn.classList.add('active');
      btn.addEventListener('click',()=>{if(!usedByOther){setupPlayers[i].col=c;buildSetup();}});
      opts.appendChild(btn);
    });
    div.append(lbl,opts);conf.appendChild(div);
  });
}
document.querySelectorAll('.cnt-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.cnt-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');numPlayers=parseInt(b.dataset.n);buildSetup();
  });
});
buildSetup();
document.getElementById('start-btn').addEventListener('click',()=>{
  if(setupPlayers.some(p=>!p.col)){alert('Each player needs a colour.');return;}
  document.getElementById('setup').style.display='none';
  document.getElementById('game').style.display='flex';
  startGame(setupPlayers.map(p=>({...p})));
});

// ── Game ──────────────────────────────────────────────────────────────────────
const G={board:new Map(),bag:[],players:[],cur:0,phase:'idle',turnPhase:'free',sel:null,selP:-1,rot:0};
function startGame(playerDefs){
  const bag=TILES.map(t=>({...t}));shuffle(bag);
  G.bag=bag;G.board=new Map();
  G.players=playerDefs.map(pd=>({col:pd.col,hand:[]}));
  G.phase='play';G.sel=null;G.selP=-1;G.rot=0;
  for(let p=0;p<G.players.length;p++)for(let i=0;i<6;i++)drawT(p);
  G.cur=0|Math.random()*G.players.length;
  startTurn();setTimeout(resizeBoard,50);
}
function drawT(p){if(G.bag.length)G.players[p].hand.push(G.bag.pop());}
function rotateTile(t,n){const edges=rotateEdges(t.edges,n);return{...t,edges,curves:edgesToCurves(edges)};}
function occCount(q,r,aq,ar){return nbrs(q,r).filter(({q:nq,r:nr})=>G.board.has(hk(nq,nr))||(aq!==undefined&&nq===aq&&nr===ar)).length;}
function isForced(q,r){return!G.board.has(hk(q,r))&&occCount(q,r)>=3;}
function getForcedSpaces(){
  const cands=new Set();
  for(const k of G.board.keys()){const{q,r}=fk(k);for(const{q:nq,r:nr}of nbrs(q,r))if(!G.board.has(hk(nq,nr)))cands.add(hk(nq,nr));}
  return[...cands].map(fk).filter(({q,r})=>isForced(q,r));
}
function bagEmpty(){return G.bag.length===0;}
function checkRestrictions(q,r,tile){
  if(bagEmpty())return null;
  for(const{q:nq,r:nr}of nbrs(q,r)){
    if(G.board.has(hk(nq,nr)))continue;
    if(occCount(nq,nr,q,r)>=4)return'Would create a 4-sided space';
  }
  if(!isForced(q,r)){
    for(const{q:nq,r:nr}of nbrs(q,r))
      if(!G.board.has(hk(nq,nr))&&isForced(nq,nr))return'Cannot place next to a forced space — fill it first';
  }
  for(const{q:nq,r:nr}of nbrs(q,r)){
    if(G.board.has(hk(nq,nr)))continue;
    if(occCount(nq,nr,q,r)>=3){
      const ec=[];
      for(const{q:nnq,r:nnr}of nbrs(nq,nr)){
        const di=DIRS.findIndex(([a,b])=>a===nnq-nq&&b===nnr-nr);if(di<0)continue;
        let obj=null;if(nnq===q&&nnr===r)obj=tile;else if(G.board.has(hk(nnq,nnr)))obj=G.board.get(hk(nnq,nnr));
        if(obj)ec.push(obj.edges[di]);
      }
      if(ec.length>=3&&ec.every(c=>c===ec[0]))return'Would create an unfillable forced space';
    }
  }
  return null;
}
function canPlace(q,r,tile){
  if(G.board.has(hk(q,r)))return false;
  if(G.board.size===0)return true;
  const ns=nbrs(q,r);let adj=false;
  for(let d=0;d<6;d++){const nk=hk(ns[d].q,ns[d].r);if(!G.board.has(nk))continue;adj=true;if(tile.edges[(d+3)%6]!==G.board.get(nk).edges[d])return false;}
  return adj&&checkRestrictions(q,r,tile)===null;
}
function canPlaceReason(q,r,tile){
  if(G.board.has(hk(q,r)))return'Space occupied';
  if(G.board.size===0)return null;
  const ns=nbrs(q,r);let adj=false;
  for(let d=0;d<6;d++){
    const nk=hk(ns[d].q,ns[d].r);if(!G.board.has(nk))continue;adj=true;
    const mine=tile.edges[(d+3)%6],theirs=G.board.get(nk).edges[d];
    if(mine!==theirs)return`My ${CN[mine]||mine} ≠ neighbour's ${CN[theirs]||theirs}`;
  }
  if(!adj)return'Must be adjacent to placed tiles';
  return checkRestrictions(q,r,tile);
}
function slots(){
  if(G.board.size===0)return[{q:0,r:0}];
  const s=new Set();
  for(const k of G.board.keys()){const{q,r}=fk(k);for(const{q:nq,r:nr}of nbrs(q,r))if(!G.board.has(hk(nq,nr)))s.add(hk(nq,nr));}
  return[...s].map(fk);
}
function canFillAnyForced(){
  const forced=getForcedSpaces();if(!forced.length)return false;
  const hand=G.players[G.cur].hand;
  for(const{q,r}of forced)for(const t of hand)for(let rot=0;rot<6;rot++)if(canPlace(q,r,rotateTile(t,rot)))return true;
  return false;
}
function startTurn(){
  G.sel=null;G.selP=-1;G.rot=0;
  if(canFillAnyForced()){G.turnPhase='forced1';setMsg(`P${G.cur+1} (${CN[G.players[G.cur].col]}): fill forced spaces first`,'warn');}
  else{G.turnPhase='free';setMsg(`P${G.cur+1} (${CN[G.players[G.cur].col]}): make your free move`,'info');}
  updateUI();render();
}
function updateUI(){
  const pi=document.getElementById('phase-ind'),bd=document.getElementById('bdone');
  if(G.phase!=='play'){pi.textContent='';pi.className='pi';bd.style.display='none';}
  else if(G.turnPhase==='forced1'||G.turnPhase==='forced2'){
    pi.textContent='⚠ Forced';pi.className='pf';
    bd.style.display=canFillAnyForced()?'none':'inline-block';
    bd.textContent=G.turnPhase==='forced1'?'→ Free move':'→ End turn';
  }else{pi.textContent='● Free move';pi.className='pfr';bd.style.display='none';}
  document.getElementById('bag-count').textContent=G.bag.length;
}
function placeTile(q,r,rt,handIdx){
  G.board.set(hk(q,r),rt);G.players[G.cur].hand.splice(handIdx,1);
  G.sel=null;G.selP=-1;G.rot=0;drawT(G.cur);
}
function doClick(px,py){
  if(G.phase!=='play')return;
  if(G.sel===null||G.selP!==G.cur){setMsg('Select a tile from your hand first','bad');return;}
  const{q,r}=p2h(px,py);
  const rt=rotateTile(G.players[G.cur].hand[G.sel],G.rot);
  const reason=canPlaceReason(q,r,rt);
  if(reason){setMsg(reason,'bad');return;}
  const forced=getForcedSpaces();
  const isF=forced.some(f=>f.q===q&&f.r===r);
  if((G.turnPhase==='forced1'||G.turnPhase==='forced2')&&!isF){setMsg('Must fill a forced space (orange) first','bad');return;}
  placeTile(q,r,rt,G.sel);
  if(G.turnPhase==='forced1'||G.turnPhase==='forced2'){
    if(canFillAnyForced())setMsg(`P${G.cur+1}: fill another forced space`,'warn');
    else{if(G.turnPhase==='forced1'){G.turnPhase='free';setMsg(`P${G.cur+1}: now make your free move`,'info');}else{endTurn();return;}}
  }else{
    if(canFillAnyForced()){G.turnPhase='forced2';setMsg(`P${G.cur+1}: fill forced spaces created by your move`,'warn');}
    else{endTurn();return;}
  }
  if(G.bag.length===0&&G.players.every(p=>p.hand.length===0)){endGame();return;}
  updateUI();render();
}
function endTurn(){G.cur=(G.cur+1)%G.players.length;startTurn();}
function endGame(){
  G.phase='end';
  const sc=G.players.map((p,i)=>({i,col:p.col,s:longestChain(p.col)})).sort((a,b)=>b.s-a.s);
  setMsg(`Game over! P${sc[0].i+1} (${CN[sc[0].col]}) wins — ${sc[0].s} tiles!`,'good');
  document.getElementById('phase-ind').textContent='';document.getElementById('bdone').style.display='none';render();
}
function longestChain(col){
  let best=0;const vis=new Set();
  for(const[tk]of G.board){
    const tile=G.board.get(tk);
    for(let e=0;e<6;e++){
      if(tile.edges[e]!==col)continue;
      const sid=tk+':'+e;if(vis.has(sid))continue;
      const seen=new Set([sid]),queue=[[tk,e]],inChain=new Set([tk]);
      while(queue.length){
        const[ctk,ine]=queue.shift();const ct=G.board.get(ctk);if(!ct)continue;
        for(let e2=0;e2<6;e2++){
          if(e2===ine||ct.edges[e2]!==col)continue;
          inChain.add(ctk);
          const d=(e2+3)%6,{q,r}=fk(ctk),{q:nq,r:nr}=nbrs(q,r)[d];
          const ntk=hk(nq,nr),nid=ntk+':'+d;
          if(G.board.has(ntk)&&!seen.has(nid)){seen.add(nid);inChain.add(ntk);queue.push([ntk,d]);}
        }
      }
      best=Math.max(best,inChain.size);for(const s of seen)vis.add(s);
    }
  }
  return best;
}

// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas=document.getElementById('bc');
const ctx=canvas.getContext('2d');
let bw=0,bh=0,ox=0,oy=0,hov=null;
const HS=40;
function resizeBoard(){
  const a=document.getElementById('ba');bw=a.clientWidth;bh=a.clientHeight;
  canvas.width=bw;canvas.height=bh;ox=bw/2;oy=bh/2;drawBoard();
}
function h2p(q,r){return{x:ox+HS*Math.sqrt(3)*(q+r/2),y:oy+HS*1.5*r};}
function p2h(px,py){const x=(px-ox)/HS,y=(py-oy)/HS;return rndH(x*Math.sqrt(3)/3-y/3,y*2/3);}
function rndH(q,r){
  const s=-q-r;let rq=Math.round(q),rr=Math.round(r),rs=Math.round(s);
  const dq=Math.abs(rq-q),dr=Math.abs(rr-r),ds=Math.abs(rs-s);
  if(dq>dr&&dq>ds)rq=-rr-rs;else if(dr>ds)rr=-rq-rs;return{q:rq,r:rr};
}
function drawBoard(){
  ctx.clearRect(0,0,bw,bh);ctx.fillStyle='#111';ctx.fillRect(0,0,bw,bh);
  const forced=G.phase==='play'?getForcedSpaces():[];
  for(const{q,r}of forced){
    const{x,y}=h2p(q,r);
    ctx.save();hexPath(ctx,x,y,HS);ctx.fillStyle='rgba(150,80,0,0.25)';ctx.fill();
    ctx.strokeStyle='rgba(200,130,0,0.8)';ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.stroke();
    ctx.setLineDash([]);ctx.restore();
  }
  for(const[k,t]of G.board){
    const{q,r}=fk(k);const{x,y}=h2p(q,r);
    if(x<-HS*2||x>bw+HS*2||y<-HS*2||y>bh+HS*2)continue;
    drawHex(ctx,x,y,t,HS);
  }
  if(G.phase==='play'){
    for(const{q,r}of slots()){
      if(forced.some(f=>f.q===q&&f.r===r))continue;
      const{x,y}=h2p(q,r);
      if(x<-HS*2||x>bw+HS*2||y<-HS*2||y>bh+HS*2)continue;
      ctx.save();hexPath(ctx,x,y,HS);ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;ctx.stroke();ctx.restore();
    }
    if(hov&&G.sel!==null&&G.selP===G.cur&&G.sel<G.players[G.cur].hand.length){
      const{q,r}=hov;const{x,y}=h2p(q,r);
      const rt=rotateTile(G.players[G.cur].hand[G.sel],G.rot);
      const ok=canPlace(q,r,rt),isF=forced.some(f=>f.q===q&&f.r===r);
      drawHex(ctx,x,y,rt,HS,ok&&(G.turnPhase==='free'||isF)?0.85:0.18);
    }
  }
}
let drag=false,ds=null,doff=null;
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  if(drag){ox=doff.x+(px-ds.x);oy=doff.y+(py-ds.y);drawBoard();return;}
  hov=p2h(px,py);drawBoard();
});
canvas.addEventListener('mousedown',e=>{
  drag=false;const r=canvas.getBoundingClientRect();
  ds={x:e.clientX-r.left,y:e.clientY-r.top};doff={x:ox,y:oy};
  const mm=ev=>{if(Math.abs(ev.clientX-canvas.getBoundingClientRect().left-ds.x)+Math.abs(ev.clientY-canvas.getBoundingClientRect().top-ds.y)>6)drag=true;};
  const mu=ev=>{document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);if(!drag){const rr=canvas.getBoundingClientRect();doClick(ev.clientX-rr.left,ev.clientY-rr.top);}drag=false;};
  document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
});
canvas.addEventListener('mouseleave',()=>{hov=null;drawBoard();});
function setMsg(t,c){const el=document.getElementById('msg');el.textContent=t;el.className=c||'info';}
function render(){renderPanels();updateUI();drawBoard();}
function renderPanels(){
  if(G.phase==='idle')return;
  const cont=document.getElementById('panels');cont.innerHTML='';
  const forced=getForcedSpaces();
  G.players.forEach((pl,p)=>{
    const isAct=p===G.cur;
    const pp=document.createElement('div');pp.className='pp'+(isAct?' act':'');
    const hdr=document.createElement('div');hdr.className='pp-hdr';
    const dot=document.createElement('div');dot.className='pp-dot';dot.style.background=CLR[pl.col];
    const nm=document.createElement('span');nm.className='pp-name';nm.textContent=`P${p+1} ${CN[pl.col]}`;
    const sc=document.createElement('span');sc.className='pp-score';sc.style.color=CLR[pl.col];
    sc.textContent=(G.board.size?longestChain(pl.col):0)+'pts';
    hdr.append(dot,nm,sc);
    const grid=document.createElement('div');grid.className='hgrid';
    pl.hand.forEach((tile,i)=>{
      let fits=false;
      if(isAct)for(const{q,r}of forced)for(let rot=0;rot<6&&!fits;rot++)if(canPlace(q,r,rotateTile(tile,rot)))fits=true;
      const isSel=G.sel===i&&G.selP===p&&isAct;
      const w=document.createElement('div');
      w.className='hw'+(isSel?' sel':'')+(fits?' forced':'')+(isAct?'':' inact');
      const c=document.createElement('canvas');c.width=54;c.height=56;
      const ct=c.getContext('2d');
      drawHex(ct,27,28,isAct&&isSel?rotateTile(tile,G.rot):tile,20);
      ct.fillStyle='rgba(255,255,255,0.16)';ct.font='bold 6px sans-serif';
      ct.textAlign='center';ct.textBaseline='middle';ct.fillText(tile.n,27,28);
      w.appendChild(c);
      if(fits){const b=document.createElement('span');b.className='badge';b.textContent='!';w.appendChild(b);}
      if(isAct)w.addEventListener('click',()=>{if(G.sel===i&&G.selP===p)G.rot=(G.rot+1)%6;else{G.sel=i;G.selP=p;G.rot=0;}render();});
      grid.appendChild(w);
    });
    pp.append(hdr,grid);cont.appendChild(pp);
  });
}
document.getElementById('bn').addEventListener('click',()=>{
  document.getElementById('game').style.display='none';
  document.getElementById('setup').style.display='flex';buildSetup();
});
document.getElementById('bdone').addEventListener('click',()=>{
  if(G.turnPhase==='forced1'){G.turnPhase='free';setMsg(`P${G.cur+1}: make your free move`,'info');updateUI();render();}
  else if(G.turnPhase==='forced2')endTurn();
});
document.addEventListener('keydown',e=>{
  if((e.key==='r'||e.key==='R')&&G.sel!==null&&G.selP===G.cur){G.rot=(G.rot+1)%6;render();}
});
window.addEventListener('resize',resizeBoard);
</script>
